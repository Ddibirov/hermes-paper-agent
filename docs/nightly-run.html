<!doctype html>
<!--
  Source for docs/nightly-run.gif.

  A split scene: the run on the left, the paper on the right. The transcript is
  real output — the four data desks, a check that comes back with a lint, the
  fix, and a check that comes back clean. The two lines marked `hermes:` stand
  in for the prose desks and the lead, which need a model driving them.

  The frame is chosen by ?n=<lines visible>, so the renderer can step through
  it. To regenerate:  python3 docs/render-nightly-gif.py
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hermes Paper Agent — a nightly run</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=block" rel="stylesheet" />
    <style>
      :root {
        --paper: #faf7f0;
        --edge: #f2ede2;
        --ink: #1a1714;
        --soft: #4a443c;
        --faint: #7d7568;
        --rule: #c9c1b2;
        --hair: #ddd6c8;
        --red: #8c2f22;
        --green: #3f5d3a;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; background: var(--paper); color: var(--ink);
        font-family: 'Source Serif 4', Georgia, serif;
        -webkit-font-smoothing: antialiased;
      }
      .scene { width: 1100px; height: 520px; padding: 22px 26px 18px; display: flex; flex-direction: column; }

      .head { border-bottom: 3px solid var(--ink); padding-bottom: 5px; flex: none; }
      .head::after { content: ''; display: block; border-bottom: 1px solid var(--ink); margin-top: 2px; }
      .head h1 { font-family: 'Playfair Display', Georgia, serif; font-size: 21px; margin: 0; }
      .head .sub { font-size: 11px; font-variant-caps: all-small-caps; letter-spacing: 0.16em; color: var(--faint); margin-top: 2px; }

      .split { flex: 1; display: grid; grid-template-columns: 1.16fr 1fr; gap: 20px; margin-top: 14px; min-height: 0; }

      /* ---------- left: the run ---------- */
      .term {
        border: 1px solid var(--rule); background: var(--edge);
        padding: 12px 14px; overflow: hidden;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 10.5px; line-height: 1.62; color: var(--soft);
        display: flex; flex-direction: column;
      }
      .term .kicker {
        font-family: 'Source Serif 4', Georgia, serif;
        font-size: 10.5px; font-variant-caps: all-small-caps; letter-spacing: 0.17em;
        color: var(--faint); border-bottom: 1px solid var(--hair);
        padding-bottom: 5px; margin-bottom: 8px; flex: none;
      }
      .ln { white-space: pre; }
      .ln.cmd { color: var(--ink); }
      .ln.cmd::before { content: ''; }
      .ln.warn { color: var(--red); }
      .ln.ok { color: var(--green); }
      .ln.minus { color: var(--red); }
      .ln.plus { color: var(--green); }
      .cursor { display: inline-block; width: 6px; height: 11px; background: var(--ink); vertical-align: -1px; }

      /* ---------- right: the paper ---------- */
      .out { display: flex; flex-direction: column; min-height: 0; }
      .out .kicker {
        font-size: 10.5px; font-variant-caps: all-small-caps; letter-spacing: 0.17em;
        color: var(--faint); border-bottom: 1px solid var(--hair);
        padding-bottom: 5px; margin-bottom: 9px; flex: none;
      }
      .slips { display: flex; flex-wrap: wrap; gap: 5px; align-content: flex-start; flex: 1; }
      .slip {
        border: 1px solid var(--rule); background: var(--edge);
        font-family: ui-monospace, Menlo, monospace; font-size: 9.5px; color: var(--soft);
        padding: 3px 6px;
      }
      .paper { flex: 1; position: relative; display: none; min-height: 0; }
      .paper img { width: 100%; height: 100%; object-fit: contain; object-position: center; }
      .verdict {
        flex: none; margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--hair);
        font-size: 12px; font-variant-caps: all-small-caps; letter-spacing: 0.11em; color: var(--faint);
        display: flex; justify-content: space-between;
      }
      .verdict .state.red { color: var(--red); }
      .verdict .state.green { color: var(--green); }

      .foot {
        flex: none; margin-top: 12px; border-top: 1px solid var(--rule); padding-top: 6px;
        font-size: 11px; font-variant-caps: all-small-caps; letter-spacing: 0.12em; color: var(--faint);
        display: flex; justify-content: space-between;
      }
      .foot em { font-style: italic; font-variant-caps: normal; letter-spacing: 0; }
    </style>
  </head>
  <body>
    <div class="scene">
      <div class="head">
        <h1>A nightly run</h1>
        <div class="sub">Hermes Paper Agent &middot; write → check → fix</div>
      </div>

      <div class="split">
        <div class="term">
          <div class="kicker">04:00 &middot; the run</div>
          <div id="lines"></div>
        </div>

        <div class="out">
          <div class="kicker" id="outkicker">editions/2026-09-04/articles</div>
          <div class="slips" id="slips"></div>
          <div class="paper" id="paper"><img src="../screenshots/spread-front-page.png" alt="" /></div>
          <div class="verdict">
            <span id="count">no articles yet</span>
            <span class="state" id="state">—</span>
          </div>
        </div>
      </div>

      <div class="foot">
        <span>Four data desks &middot; prose over the inbox &middot; the lead runs last</span>
        <span><em>Never publish on red.</em></span>
      </div>
    </div>

    <script>
      // Real output. The two `hermes:` lines stand in for the prose desks and
      // the lead, which need a model driving them.
      const T = [
        ['cmd',  '$ scripts/steps-desk.py   editions/2026-09-04'],
        ['out',  'wrote articles/10-the-week-in-steps.md (7 days, 56,160)'],
        ['cmd',  '$ scripts/ledger-desk.py  editions/2026-09-04'],
        ['out',  'wrote articles/07-household-ledger.md (5 entries)'],
        ['cmd',  '$ scripts/weather-desk.py editions/2026-09-04 --place ...'],
        ['out',  'wrote articles/02-your-week-in-weather.md (7-day forecast)'],
        ['cmd',  '$ scripts/finance-desk.py editions/2026-09-04 NVDA AMZN MU'],
        ['out',  'wrote articles/03-the-markets.md (NVDA, AMZN, MU)'],
        ['cmd',  '$ hermes: prose desks over feeds.md, then the lead'],
        ['out',  'wrote 01 04 05 06 08 09 11                (11 articles)'],
        ['cmd',  '$ vael-paper-check editions/2026-09-04'],
        ['out',  '2026-09-04  My Hermes Personal Paper  No. 216'],
        ['out',  '  marks (0)'],
        ['warn', '  lint (1)'],
        ['warn', '    11-the-week-ahead.md:12   cell_long'],
        ['warn', "    Cell 'Nell arrives, Union Station' is 27 chars;"],
        ['warn', '    over 26 it will be cut with an ellipsis.'],
        ['cmd',  '$ hermes: fix 11-the-week-ahead.md:12'],
        ['minus','- | Sat 11:00 | Nell arrives, Union Station |'],
        ['plus', '+ | Sat 11:00 | Nell arrives by train |'],
        ['cmd',  '$ vael-paper-check editions/2026-09-04'],
        ['out',  '2026-09-04  My Hermes Personal Paper  No. 216'],
        ['ok',   '  marks (0)   lint (0)   ok: true   clean: true'],
      ];

      // articles land as the desks report them
      const SLIPS = {
        1: '10-steps', 3: '07-ledger', 5: '02-weather', 7: '03-markets',
        9: '01 · 04 · 05 · 06 · 08 · 09 · 11',
      };

      const n = Math.max(0, Math.min(T.length, +(new URLSearchParams(location.search).get('n') ?? T.length)));

      // A real terminal scrolls; so does this one. Without it the last lines
      // of the run — the fix and the clean check — fall off the panel.
      const VISIBLE = 18;
      const lines = document.getElementById('lines');
      const first = Math.max(0, n - VISIBLE);
      for (let i = first; i < n; i++) {
        const [kind, text] = T[i];
        const el = document.createElement('div');
        el.className = 'ln ' + kind;
        el.textContent = text;
        if (i === n - 1) el.innerHTML = el.textContent.replace(/ $/, '') + '<span class="cursor"></span>';
        lines.appendChild(el);
      }

      const slips = document.getElementById('slips');
      let written = 0;
      for (let i = 0; i < n; i++) {
        if (SLIPS[i]) {
          for (const name of SLIPS[i].split(' · ')) {
            const s = document.createElement('span');
            s.className = 'slip';
            s.textContent = name;
            slips.appendChild(s);
            written++;
          }
        }
      }

      const count = document.getElementById('count');
      const state = document.getElementById('state');
      count.textContent = written ? `${written === 11 ? 11 : written} article${written === 1 ? '' : 's'} written` : 'no articles yet';

      if (n >= 23) {                       // the clean check
        document.getElementById('slips').style.display = 'none';
        document.getElementById('paper').style.display = 'block';
        document.getElementById('outkicker').textContent = 'the edition, printed';
        state.textContent = 'ok · clean';
        state.className = 'state green';
        count.textContent = '11 articles · 0 marks';
      } else if (n >= 14) {                // the lint has appeared
        state.textContent = '1 lint';
        state.className = 'state red';
      }
    </script>
  </body>
</html>
