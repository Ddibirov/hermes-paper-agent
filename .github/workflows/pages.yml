name: Pages

# Publish the sample edition as a static site on GitHub Pages.
#
# The generator lives here; the engine that prints it lives in vaelkeep/vael-paper.
# So this workflow checks the engine out alongside, builds its reader, and runs
# its exporter over the edition committed under samples/edition/. Every response
# the server would produce is a pure function of the files on disk, so the whole
# thing is written out ahead of time and served with no Python running anywhere.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel a deploy mid-flight: a half-published
# site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the engine
        uses: actions/checkout@v4
        with:
          repository: vaelkeep/vael-paper
          ref: main
          path: engine

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: engine/reader/package-lock.json

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: engine/server/uv.lock

      - name: Build the reader
        working-directory: engine/reader
        run: npm ci && npm run build

      - name: Stage the editions root
        # The exporter reads paper.json from the root it is given, so assemble
        # one from the paper's real identity plus the committed sample edition.
        # Copied rather than duplicated in the repo: editions/paper.json stays
        # the single source of the masthead.
        run: |
          mkdir -p build/editions
          cp editions/paper.json build/editions/
          cp -R samples/edition/* build/editions/
          ls -la build/editions

      - name: Check the edition before publishing it
        # Never publish on red — the same gate the nightly run uses.
        working-directory: engine/server
        run: |
          uv sync --locked
          for dir in ../../build/editions/*/; do
            uv run vael-paper-check "$dir" --json
          done

      - name: Export the site
        working-directory: engine/server
        run: |
          uv run vael-paper-export \
            --editions ../../build/editions \
            --reader ../reader/dist \
            --out ../../site \
            --base-url https://vaelkeep.github.io/hermes-paper-agent/ \
            --social-card ../../docs/social-card.png \
            --og-title "My Hermes Personal Paper" \
            --og-description "A nightly newspaper written by an agent: the figures come from code, the prose from a small local model, and it never publishes an edition with marks in it."

      - name: The export is complete
        run: |
          test -f site/index.html
          test -f site/api/editions.json
          test -f site/api/editions/latest.json
          test -f site/.nojekyll
          test -f site/social-card.png
          grep -q 'og:image" content="https://vaelkeep.github.io/hermes-paper-agent/social-card.png"' site/index.html
          grep -q '<title>My Hermes Personal Paper</title>' site/index.html
          ls site/editions/*/images/*.png >/dev/null
          python3 - <<'PY'
          import json, pathlib
          d = json.loads(pathlib.Path("site/api/editions/latest.json").read_text())
          assert d["masthead"] == "My Hermes Personal Paper", d["masthead"]
          leads = [a for a in d["articles"] if a.get("priority") == 1]
          assert len(leads) == 1, f"expected one front page, found {len(leads)}"
          print(f"ok: {d['masthead']}, {d['id']}, {len(d['articles'])} articles")
          print(f"    lead: {leads[0]['headline']}")
          PY
          echo "ok: $(find site -type f | wc -l) files"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
