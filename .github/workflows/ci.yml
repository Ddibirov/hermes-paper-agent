name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          # The README promises macOS as well as Linux, so prove it on one runner.
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dev dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Run the suite
        # The desks reach the network only through fetch(); no test calls it,
        # so this stays hermetic and does not depend on Open-Meteo or Yahoo.
        run: python -m pytest

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip -r requirements-dev.txt
      - run: python -m ruff check .

  desks:
    name: offline desks produce an edition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run the two file-backed desks against the shipped fixtures
        # The weather and finance desks need live APIs, so they are covered by
        # unit tests with canned responses rather than run here.
        run: |
          scripts/steps-desk.py  editions/ci
          scripts/ledger-desk.py editions/ci

      - name: Every article must carry a headline and a known section
        run: |
          python - <<'PY'
          import json, pathlib, re, sys
          sections = {s["id"] for s in json.loads(
              pathlib.Path("editions/paper.json").read_text())["sections"]}
          articles = sorted(pathlib.Path("editions/ci/articles").glob("*.md"))
          assert articles, "no articles were written"
          for a in articles:
              text = a.read_text()
              assert text.startswith("---\n"), f"{a}: no frontmatter"
              head = text.split("---\n")[1]
              assert re.search(r"^headline: \S", head, re.M), f"{a}: no headline"
              section = re.search(r"^section: (\S+)", head, re.M).group(1)
              assert section in sections, f"{a}: unknown section {section!r}"
              print(f"ok  {a.name}  section={section}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: sample-edition
          path: editions/ci/
          retention-days: 7

  quickstart:
    name: quickstart works from cold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run it exactly as a stranger would
        # No uv on the runner on purpose: this exercises the plain-venv
        # fallback, which is the path someone without uv actually takes.
        # The two live desks warn and skip if an API is down, so a flaky
        # Open-Meteo cannot fail the build.
        run: ./quickstart.sh --build-only --no-open

      - name: The edition it produced is a whole paper
        run: |
          python - <<'PY'
          import pathlib, sys
          root = pathlib.Path(".quickstart/editions")
          editions = [d for d in root.iterdir() if d.is_dir()]
          assert len(editions) == 1, f"expected one edition, got {editions}"
          articles = sorted((editions[0] / "articles").glob("*.md"))
          names = [a.name for a in articles]
          print(f"{editions[0].name}: {len(names)} articles")
          for n in names:
              print("  ", n)
          # the four data desks plus the seven borrowed prose/lead files
          assert len(names) >= 9, f"only {len(names)} articles; the desks did not all run"
          assert any(n.startswith("01-") for n in names), "no front page"
          PY
